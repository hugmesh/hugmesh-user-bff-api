spring:
  application:
    name: snapdragon-user-bff-api
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: "${CASDOOR_ISSUER_URI:https://id.snapdragon.systems}"
          # Explicit JWKS so the resource server does NOT do OIDC discovery against issuer-uri
          # (unreachable in-container when issuer-uri is the browser-facing localhost:8000, which
          # 500s every authenticated call). Mirrors snapdragon-actions + the gateway; compose sets
          # CASDOOR_JWKS_URI=http://casdoor:8000/.well-known/jwks. iss is still validated via issuer-uri.
          jwk-set-uri: "${CASDOOR_JWKS_URI:${CASDOOR_ISSUER_URI:https://id.snapdragon.systems}/.well-known/jwks}"

  # Runtime data access is REACTIVE (R2DBC) over the config datastore: the owner-
  # keyed user_profile / user_preference / user_block tables.
  r2dbc:
    url: "${SPRING_R2DBC_URL:r2dbc:postgresql://snapdragon-pg.snapdragon-backend.svc.cluster.local:5432/snapdragon}"
    username: "${SPRING_R2DBC_USERNAME:snapdragon}"
    password: "${SPRING_R2DBC_PASSWORD:}"

  # Liquibase owns schema migrations. It has NO R2DBC runner, so it uses a plain
  # JDBC datasource — the ONLY JDBC use in the app; all runtime access is R2DBC.
  liquibase:
    enabled: true
    change-log: "classpath:db/changelog/db.changelog-master.xml"
    url: "${SPRING_LIQUIBASE_URL:jdbc:postgresql://snapdragon-pg.snapdragon-backend.svc.cluster.local:5432/snapdragon}"
    user: "${SPRING_LIQUIBASE_USER:snapdragon}"
    password: "${SPRING_LIQUIBASE_PASSWORD:}"

# Reactive WebClient to snapdragon-federation-api (the cards + recommend-instance-
# block backend). The caller's Casdoor JWT is forwarded per request so federation-
# api scopes everything to the same subject (owner-enforcement end-to-end).
federation:
  api:
    base-url: "${FEDERATION_API_BASE_URL:http://snapdragon-federation-api.snapdragon-backend.svc.cluster.local:8080}"

# ── API-to-API mTLS (CLIENT side / OUTBOUND) ─────────────────────────────────
# The OTHER half of the server.ssl.* enforcement below: when federation-api flips
# its server-side client-auth=need, THIS BFF must present a client cert that chains
# to the cluster CA on its outbound federation-api calls. FederationHttpClientSsl
# builds a reactor-netty connector that presents this BFF's PKI client identity
# (keystore.p12) and trusts the cluster CA (truststore.p12). It REUSES the same
# SSL_* env the server-side stores use — one mounted /stores layout serves both
# directions. DEFAULT OFF: local/dev/CI (plain http, no stores) is unaffected; the
# in-cluster deployment sets SNAPDRAGON_MTLS_CLIENT_ENABLED=true alongside the
# server-side SSL_CLIENT_AUTH=need.
snapdragon:
  mtls:
    client:
      enabled: "${SNAPDRAGON_MTLS_CLIENT_ENABLED:false}"
      key-store: "${SSL_KEY_STORE:/stores/keystore.p12}"
      key-store-type: "${SSL_KEY_STORE_TYPE:PKCS12}"
      key-store-password: "${SSL_KEY_STORE_PASSWORD:}"
      trust-store: "${SSL_TRUST_STORE:/stores/truststore.p12}"
      trust-store-type: "${SSL_TRUST_STORE_TYPE:PKCS12}"
      trust-store-password: "${SSL_TRUST_STORE_PASSWORD:}"

casdoor:
  # Self-service password/email changes go to the Casdoor IdP. STUBBED by default
  # (account.enabled=false) — the reactive flow is wired but no live write runs
  # until the payload + per-user auth are validated against the deployed Casdoor.
  gateway-base: "${PKI_GATEWAY_BASE:http://snapdragon-pki-gateway.snapdragon-pki.svc.cluster.local:8080}"
  organization: "${CASDOOR_ORG:snapdragon}"
  account:
    enabled: "${CASDOOR_ACCOUNT_ENABLED:false}"
    base-url: "${CASDOOR_ACCOUNT_BASE_URL:http://casdoor.snapdragon-pki.svc.cluster.local:8000}"
    client-id: "${CASDOOR_ACCOUNT_CLIENT_ID:user-bff}"
    client-secret: "${CASDOOR_ACCOUNT_CLIENT_SECRET:}"

# External self-block push targets. Base URLs grounded in the snapdragon-generator
# manifests (tuwunel = Matrix :8008, akkoma = Mastodon-API :4000). STUBBED by
# default (enabled=false) — the durable user_block row is the source of truth; the
# external push needs per-user token brokering before going live (see README).
block:
  matrix:
    enabled: "${BLOCK_MATRIX_ENABLED:false}"
    base-url: "${MATRIX_URL:http://tuwunel.snapdragon-backend.svc.cluster.local:8008}"
  mastodon:
    enabled: "${BLOCK_MASTODON_ENABLED:false}"
    base-url: "${MASTODON_URL:http://akkoma.snapdragon-backend.svc.cluster.local:4000}"

# PROFILE-IMAGE VISION MODERATION (on-prem edge-AI). Ships DARK — enabled=false ⇒ avatar
# uploads are UNCHANGED (allow-all). When enabled, every avatar is scanned by the shared
# edge-ai-analysis service (POST /v1/analyze/content/moderate) BEFORE publish; a policy-hit
# (nsfw/abuse) blocks the upload (422). FAIL-CLOSED: if the scanner is unreachable while
# enabled, the upload is rejected (an unscanned image is never published). Needs a GPU/edge-AI
# node — capability-gated like the other optional services.
moderation:
  image:
    enabled: "${MODERATION_IMAGE_ENABLED:false}"
    base-url: "${MODERATION_IMAGE_BASE_URL:http://snapdragon-edge-ai-analysis.snapdragon-inference.svc.cluster.local:8080}"
    timeout-ms: "${MODERATION_IMAGE_TIMEOUT_MS:15000}"

# USER SELF-SILENCE (self-service visibility hide; NOT a ban). The durable
# self_silence row is the source of truth; expires_at is authoritative and a
# @Scheduled wake (SelfSilenceExpiryAction) auto-clears at expiry.
#
# All three hide legs are GATED stub-seams that NEVER hard-fail (scope-guard):
#   • self-silence.federation.enabled — the federation user-scope hide-profile
#     apply/clear leg (the federation-api endpoint ships in a later phase; OFF here);
#   • external.matrix.enabled / external.mastodon.enabled — the homeserver
#     directory/discovery hide seams (tuwunel exclude-from-directory via the
#     admin-room bot; akkoma discoverable=false) — the real admin verbs are pinned
#     against the deployed servers later. Default OFF: the row stands regardless.
self-silence:
  federation:
    enabled: "${SELF_SILENCE_FEDERATION_ENABLED:false}"
  check-interval-ms: "${SELF_SILENCE_CHECK_INTERVAL_MS:60000}"
  initial-delay-ms: "${SELF_SILENCE_INITIAL_DELAY_MS:30000}"

external:
  matrix:
    enabled: "${EXTERNAL_MATRIX_ENABLED:false}"
    base-url: "${MATRIX_URL:http://tuwunel.snapdragon-backend.svc.cluster.local:8008}"
  mastodon:
    enabled: "${EXTERNAL_MASTODON_ENABLED:false}"
    base-url: "${MASTODON_URL:http://akkoma.snapdragon-backend.svc.cluster.local:4000}"

# ── BFF MEDIA-PROXY / AI-CLOAK (poison-before-ingest) ────────────────────────
# The server-owned media-proxy the UIs route uploads through INSTEAD of POSTing
# media directly to the homeserver. By owning the upload, the AI-cloak happens
# before any homeserver sees the bytes, owns every served size, and the decision is
# recorded SERVER-SIDE (the media_poison_decision table = audit + badge + repost
# source of truth).
#
# Ships DARK: poisoning.enabled=false ⇒ the controller is mounted but every upload
# is forwarded-through with status=none until the round-trip survival gate is
# verified on a real GPU cluster (the merge-sequencing gate). HONEST framing —
# best-effort training-set hygiene, never a guarantee: the UI says "AI-cloak
# applied", never "protected", and the badge says 'protected' ONLY when the
# perturbation survived the homeserver re-encode.
app:
  # Per-brand Casdoor issuers for multi-tenant mode. OPT-IN: empty = single-issuer.
  # Format: comma-separated issuerUri=domainName pairs.
  # When non-empty, TenancyResourceServerConfig activates; unknown issuers → 401.
  tenancy:
    issuers: "${APP_TENANCY_ISSUERS:}"

  # ── SSO LOGIN RELOCATION (user-bff owns OIDC login) — SHIPS DARK ─────────────
  # The whole OIDC-login surface (/bff/auth/callback + /bff/login|register|session,
  # the OidcCallbackController + SsoAuthController + the AdminBffInternalClient) is
  # inert until app.bff.oidc.enabled flips to true:
  #   • enabled=false ⇒ auth-core OidcExchangeConfig contributes NO OidcExchangeClient
  #     bean (the callback 503s), AND the AdminBffInternalClient is a fail-closed stub
  #     (every account/session op errors — never a silent auth).
  # bff.custody-key: the AES-256-GCM data key the BffCustodyCipher uses to encrypt the
  # exchanged access/refresh tokens at rest BEFORE handing the ciphertext to admin-bff.
  # ESO/Vault-sourced at deploy, NEVER a literal in git. BLANK ⇒ the cipher is INERT
  # and the callback 503s even if oidc.enabled=true (the OidcCustodyBootGuard ALSO
  # fails the boot for that combination — fail-closed, no plaintext token at rest).
  bff:
    oidc:
      enabled: "${APP_BFF_OIDC_ENABLED:false}"
      issuer: "${APP_BFF_OIDC_ISSUER:${casdoor.gateway-base}}"
      token-path: "${APP_BFF_OIDC_TOKEN_PATH:/api/login/oauth/access_token}"
      client-id: "${APP_BFF_OIDC_CLIENT_ID:user-bff}"
      client-secret: "${APP_BFF_OIDC_CLIENT_SECRET:}"
      redirect-uri: "${APP_BFF_OIDC_REDIRECT_URI:https://snapdragon.systems/login/callback}"
      default-expiry-seconds: 3600
    custody-key: "${APP_BFF_CUSTODY_KEY:}"
  # The opaque bff_ session cookie (auth-core SessionCookieService). LIVE BY DEFAULT:
  # enabled=true ⇒ /bff/login (and the OIDC callback) emit the HttpOnly Set-Cookie so
  # browsers hold the session in a cookie instead of JS-readable storage. The session
  # token is ALSO still returned in the response body (vestigial) so non-UI consumers
  # that read $.token keep working. Set APP_SESSION_COOKIE_ENABLED=false to go back to
  # body-only (no Set-Cookie). secure default true; ttl default 12h.
  session:
    cookie:
      enabled: "${APP_SESSION_COOKIE_ENABLED:true}"
      secure: "${APP_SESSION_COOKIE_SECURE:true}"
      ttl: "${APP_SESSION_COOKIE_TTL:PT12H}"
  # OUTBOUND X-Internal-Token the AdminBffInternalClient stamps on its calls to
  # admin-bff's internal surface (matches admin-bff's INBOUND auth-core
  # InternalTokenWebFilter). BLANK ⇒ no stamp (dev/test/CI; admin-bff's filter is a
  # matching no-op) — ESO/Vault-sourced in-cluster, never a literal in git.
  internal:
    token: "${INTERNAL_TOKEN:}"
    token-header: "${APP_INTERNAL_TOKEN_HEADER:X-Internal-Token}"
  # admin-bff internal base-url the AdminBffInternalClient targets (account + session +
  # custody-stamp ops; admin-bff owns those tables — user-bff has no such DB). A NEW
  # egress peer (user-bff -> admin-bff :8080) is required in the manifests/generator
  # repo as a follow-up (see PR body); the existing mutual db-denial stays.
  admin-bff:
    internal:
      base-url: "${ADMIN_BFF_INTERNAL_BASE_URL:http://snapdragon-admin-bff-api.snapdragon-backend.svc.cluster.local:8080}"

  # ── ACTIVE SESSION MANAGEMENT (/bff/user/sessions) — SHIPS LIVE ──────────────
  # The user-facing "list/revoke MY login sessions" feature. UNLIKE the OIDC-login
  # internal client (a fail-closed stub until app.bff.oidc.enabled flips), session
  # management is an always-on user feature that works in the live gateway-forwarded-JWT
  # world today, so its SessionsInternalClient is wired UNCONDITIONALLY (reusing the same
  # mTLS connector + X-Internal-Token stamp + app.admin-bff.internal.base-url as the OIDC
  # client). It targets admin-bff's GET/DELETE /bff/internal/sessions/** surface (admin-bff
  # owns the bff_session table). enabled=false ⇒ the client is a GRACEFUL stub (empty list
  # / no-op revoke) — non-destructive degradation, never a 500. Default ON.
  sessions:
    management:
      enabled: "${APP_SESSIONS_MANAGEMENT_ENABLED:true}"

  # ── D6 Matrix/Mastodon BFF-proxy (custody store + mint + reactive proxy) ──────
  # LIVE BY DEFAULT: enabled=true ⇒ /bff/user/{matrix,mastodon}/** reverse-proxies with
  # the SERVER-HELD homeserver token injected (owner = the bff_ session subject); the
  # browser holds NO homeserver access token. The token-removal cutover makes this the
  # only path — the browser MUST call these proxy endpoints with the HttpOnly bff_ cookie.
  # Even when enabled=true the proxy still 503s unless a custody key (app.hs-token.key)
  # is provisioned AND the tuwunel-proxy/akkoma-proxy mTLS sidecars exist (fail-closed).
  # Override APP_HS_TOKEN_ENABLED=false to fully dark the surface.
  #
  # key: the AES-256-GCM data key for the at-rest custody-token cipher — ESO/Vault-
  # sourced at deploy, NEVER a literal in git. Blank ⇒ the cipher is INERT and the
  # proxy 503s even if enabled=true (fail-closed, no plaintext fallback).
  #
  # matrix-url/mastodon-url: the per-pod mTLS proxy sidecars the mint + proxy forward
  # through (ssl_verify_client on; the BFF presents the SNAPDRAGON_MTLS_CLIENT_* PKI
  # identity). svc-password: the homeserver service-account password the broker mints
  # with — ESO/Vault-sourced at deploy, never a real literal in git.
  #
  # registry.enabled: write the SHA-256 mint hash to the gateway hs_tokens registry so
  # the gateway HomeserverTokenRevocationFilter keeps working. Default OFF (the custody
  # row + decrypted token are the source of truth; the gateway hash converges next tick).
  hs-token:
    enabled: "${APP_HS_TOKEN_ENABLED:true}"
    key: "${APP_HS_TOKEN_KEY:}"
    matrix-url: "${APP_HS_TOKEN_MATRIX_URL:https://tuwunel-proxy.snapdragon-backend.svc.cluster.local:4443}"
    mastodon-url: "${APP_HS_TOKEN_MASTODON_URL:https://akkoma-proxy.snapdragon-backend.svc.cluster.local:4443}"
    # EMPTY DEFAULT + FAIL-CLOSED (mirrors `key` above): when unset, the broker bean
    # still wires (it is an unconditional @Service injected by the always-present proxy
    # controllers) but every mint 503s — exactly like an unconfigured custody `key`
    # (HsTokenCipher) — instead of crashing the whole context at boot on an unresolved
    # mandatory placeholder. So a deploy that turns the proxy on without provisioning the
    # service password gets a clean 503, and a deploy that leaves hs-token OFF
    # (APP_HS_TOKEN_ENABLED=false) boots cleanly without needing the secret at all.
    # NEVER a real literal in git: the "test"/"prod-deny-slice" profiles supply a
    # throwaway value; prod sources it from ESO/Vault.
    svc-password: "${APP_HS_TOKEN_SVC_PASSWORD:}"
    registry:
      enabled: "${APP_HS_TOKEN_REGISTRY_ENABLED:false}"
      base-url: "${APP_HS_TOKEN_REGISTRY_BASE_URL:${GATEWAY_URL:http://snapdragon-gateway.snapdragon-backend.svc.cluster.local:8080}}"
  media:
    poisoning:
      enabled: "${MEDIA_POISONING_ENABLED:false}"
      # default cloak for an opted-in image (UI shows this as default-ON).
      default-mode: "${MEDIA_POISONING_DEFAULT_MODE:glaze}"
      # behaviour when the OPTIONAL heavy-tier worker is ABSENT (Pi5-only cluster):
      # skip (forward UNCLOAKED + status=skipped so the UI warns 'not cloaked') |
      # light (reduced-strength CPU, if the worker offers it) | queue (placeholder).
      fallback-mode: "${MEDIA_POISONING_FALLBACK_MODE:skip}"
      # the served thumbnail sizes to ALSO poison so no clean derivative exists
      # (akkoma 'small'; Matrix 240x240 — enumerated + pinned). Comma list -> List.
      thumbnail-sizes: "${MEDIA_POISONING_THUMBNAIL_SIZES:small,240x240}"
      # hard per-job latency budget (ms) for the worker poison/survival calls.
      timeout-ms: "${MEDIA_POISONING_TIMEOUT_MS:120000}"
      # short /health probe timeout (ms) so capability queries never hang.
      health-timeout-ms: "${MEDIA_POISONING_HEALTH_TIMEOUT_MS:2000}"
      # max accepted upload size (bytes); a larger part is a clean 400.
      max-upload-bytes: "${MEDIA_POISONING_MAX_UPLOAD_BYTES:20971520}"
      # the OPTIONAL snapdragon-media-poisoner worker (x86/GPU heavy tier). BLANK ⇒
      # no worker wired ⇒ capability reports backend=none ⇒ lean fallback. k8s
      # protocol-probe of the Service /health, NO Eureka/Config/Task.
      worker-url: "${MEDIA_POISONING_WORKER_URL:}"
    # The REAL homeserver upload + served-byte re-fetch goes through the EXISTING
    # mTLS proxies (akkoma-proxy:4443 / tuwunel-proxy:4443, ssl_verify_client on) —
    # NEVER by mounting the RWO media PVCs. The BFF presents its cluster-CA client
    # identity (the same SNAPDRAGON_MTLS_CLIENT_* stores as federation) and forwards
    # the caller bearer only as far as the BFF. Default-OFF per platform so
    # local/dev/CI (no proxy/stores) wires null clients ⇒ forward-through.
    proxy:
      mastodon:
        enabled: "${MEDIA_PROXY_MASTODON_ENABLED:false}"
        base-url: "${MEDIA_PROXY_MASTODON_BASE_URL:https://akkoma-proxy.snapdragon-backend.svc.cluster.local:4443}"
      matrix:
        enabled: "${MEDIA_PROXY_MATRIX_ENABLED:false}"
        base-url: "${MEDIA_PROXY_MATRIX_BASE_URL:https://tuwunel-proxy.snapdragon-backend.svc.cluster.local:4443}"
  # ── PRE-PUBLISH vision moderation (edge-AI) ──────────────────────────────────
  # On avatar/profile-image set, send bytes to the on-prem edge-ai-analysis API
  # (POST /v1/analyze/content/moderate) BEFORE publishing: reject ⇒ fail-closed 422,
  # flag ⇒ allow + queue a finding, allow ⇒ proceed. Ships DARK (enabled=false): the
  # gate is wired but bypassed until the edge-ai-analysis service is deployed + this
  # is flipped on. All inference on-prem; nothing leaves the mesh.
  vision:
    moderation:
      enabled: "${VISION_MODERATION_ENABLED:false}"
      # in-cluster ClusterIP of the edge-ai-analysis service (generator optional svc).
      base-url: "${VISION_MODERATION_BASE_URL:http://snapdragon-edge-ai-analysis.snapdragon-inference.svc.cluster.local:8080}"
      endpoint: "${VISION_MODERATION_ENDPOINT:/v1/analyze/content/moderate}"
      # hard per-call latency budget (ms); on timeout the fail-closed policy applies.
      timeout-ms: "${VISION_MODERATION_TIMEOUT_MS:10000}"
      # fail-closed (true): an analysis-API error BLOCKS the upload (503) — an unscanned
      # image never publishes. false = fail-open (availability-first). A clean 'reject'
      # verdict always blocks regardless.
      fail-closed: "${VISION_MODERATION_FAIL_CLOSED:true}"
      max-bytes: "${VISION_MODERATION_MAX_BYTES:8388608}"

# Multipart limits for the media-proxy /upload (bounded in-memory hold of the bytes
# the BFF cloaks-then-forwards). Aligned with app.media.poisoning.max-upload-bytes.
spring.http.codecs.max-in-memory-size: "${MEDIA_POISONING_MAX_UPLOAD_BYTES:20971520}"
spring.webflux.multipart:
  max-in-memory-size: "${MEDIA_MULTIPART_MAX_IN_MEMORY:262144}"
  max-disk-usage-per-part: "${MEDIA_POISONING_MAX_UPLOAD_BYTES:20971520}"
  max-parts: 16

# SpringDoc OpenAPI. The spec at /v3/api-docs is the source the platform
# ng-openapi-gen typed client (the paired snapdragon-user-ui) + the docs pipeline
# consume. Spec + UI are gated by SecurityConfig: permitAll under dev/test (so
# `gen:fetch` can curl the spec without a token) and ROLE_ADMIN otherwise (prod).
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
    version: openapi_3_0
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  # Restrict the component scan to this BFF's own controllers so the spec stays the
  # user-BFF surface only (no stray springframework/actuator paths leak in).
  packages-to-scan: systems.snapdragon.userbff

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: 8080
  # ── API-to-API mTLS enforcement (server side) ──────────────────────────────
  # When the in-cluster keystore initContainer is mounted (the gateway-chart
  # build-keystore equivalent: PKCS12 keystore.p12 = this service's Vault-PKI
  # identity + truststore.p12 = the cluster CA), the deployment flips these on so
  # the TLS handshake REQUIRES a client cert that chains to the cluster CA. A
  # caller that was NOT deployed+signed by our Vault/ESO PKI process holds no such
  # cert, so its handshake is rejected — it cannot read or call this API at all.
  #
  # Defaults keep local/dev/CI working: ssl.enabled=false (plaintext) and
  # client-auth=none, so the truststore is never opened and existing tests are
  # unaffected. In-cluster, the deployment sets SSL_ENABLED=true,
  # SSL_CLIENT_AUTH=need and points the key-store/trust-store at the mounted
  # PKCS12 stores (default paths below match the gateway chart's /stores layout).
  # The store passwords are generated in-pod and injected via env (never in git).
  ssl:
    enabled: "${SSL_ENABLED:false}"
    client-auth: "${SSL_CLIENT_AUTH:none}"
    key-store: "${SSL_KEY_STORE:/stores/keystore.p12}"
    key-store-type: "${SSL_KEY_STORE_TYPE:PKCS12}"
    key-store-password: "${SSL_KEY_STORE_PASSWORD:}"
    trust-store: "${SSL_TRUST_STORE:/stores/truststore.p12}"
    trust-store-type: "${SSL_TRUST_STORE_TYPE:PKCS12}"
    trust-store-password: "${SSL_TRUST_STORE_PASSWORD:}"
    # TLSv1.3 floor (forward-secret, AEAD-only) — matches the gateway chart.
    enabled-protocols: "${SSL_ENABLED_PROTOCOLS:TLSv1.3}"
