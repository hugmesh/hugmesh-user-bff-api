# Full-context test profile. The DB (R2DBC for the app + JDBC for Liquibase) is a
# REAL Postgres container wired by the shared
# systems.snapdragon.commons.testsupport.PostgresTestSupport base (per-class db over a
# session-shared postgres:16 container). NO H2 here for the full @SpringBootTest tests
# — the @DataR2dbcTest slices still use H2 via TestDatabaseConfig and do NOT load this
# profile.
#
# spring.r2dbc.url / spring.liquibase.url + credentials are supplied by the base via
# @DynamicPropertySource (pointed at the SAME container), so the production
# R2dbcAutoConfiguration + LiquibaseAutoConfiguration run normally and Liquibase
# migrates the DB the app then reads — that is why the old autoconfigure-exclude block
# and liquibase.enabled:false are GONE.
#
# The context-load test mocks the reactive JWT decoder (@MockitoBean) so no live
# Casdoor issuer is contacted. External Matrix/Mastodon + Casdoor account writes stay
# STUBBED.
spring:
  liquibase:
    enabled: true
    change-log: "classpath:db/changelog/db.changelog-master.xml"

casdoor:
  account:
    enabled: false

block:
  matrix:
    enabled: false
  mastodon:
    enabled: false
