# Profile for RawApiDenyOwnerScopedIdorTest.
#
# DELIBERATELY NOT the `test` profile: the prod (!dev & !test) SecurityConfig chain
# must be active so the privilege-containment assertions exercise the MOST RESTRICTIVE
# posture (OpenAPI spec gated to ROLE_ADMIN, not permitAll). This profile name is
# neither `dev` nor `test`, so the `filterChain` (prod) bean is selected.
#
# The DB is a REAL Postgres container wired by the shared
# net.hugmesh.commons.testsupport.PostgresTestSupport base (the test extends
# it): spring.r2dbc.url / spring.liquibase.url + credentials come from the base via
# @DynamicPropertySource, so the production R2dbcAutoConfiguration +
# LiquibaseAutoConfiguration run and Liquibase migrates the DB. The real multi-issuer
# resource server validates tokens against the in-process TestIssuer JWKS servers
# (issuer-uri + app.tenancy.issuers are injected via @DynamicPropertySource on the
# test). That is why the old autoconfigure-exclude block + liquibase.enabled:false are
# GONE.
spring:
  liquibase:
    enabled: true
    change-log: "classpath:db/changelog/db.changelog-master.xml"

casdoor:
  account:
    enabled: false

block:
  matrix:
    enabled: false
  mastodon:
    enabled: false

# The now-mandatory homeserver svc-password (application.yml has no default —
# fail-closed in prod); supply a throwaway value so the full-context broker bean
# instantiates under this prod-posture slice. Not a real credential.
app:
  hs-token:
    svc-password: "test-svc-pw"
