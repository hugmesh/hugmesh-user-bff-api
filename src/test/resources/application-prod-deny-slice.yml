# Profile for RawApiDenyOwnerScopedIdorTest.
#
# DELIBERATELY NOT the `test` profile: the prod (!dev & !test) SecurityConfig chain
# must be active so the privilege-containment assertions exercise the MOST RESTRICTIVE
# posture (OpenAPI spec gated to ROLE_ADMIN, not permitAll). This profile name is
# neither `dev` nor `test`, so the `filterChain` (prod) bean is selected.
#
# It otherwise mirrors application-test.yml's wiring so the full @SpringBootTest boots
# in CI with NO live Postgres / Casdoor: TestDatabaseConfig supplies an H2-PG-compat
# ConnectionFactory + DatabaseClient + the real Liquibase changelog, and the real
# multi-issuer resource server validates tokens against the in-process TestIssuer JWKS
# servers (issuer-uri + app.tenancy.issuers are injected via @DynamicPropertySource).
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.r2dbc.R2dbcAutoConfiguration
      - org.springframework.boot.autoconfigure.r2dbc.R2dbcTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.liquibase.LiquibaseAutoConfiguration
  liquibase:
    enabled: false

casdoor:
  account:
    enabled: false

block:
  matrix:
    enabled: false
  mastodon:
    enabled: false
