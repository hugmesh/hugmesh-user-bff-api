# Snapdragon CI — build + push this service's container image to the in-cluster
# GitLab container registry. The GitHub repo is pull-mirrored into in-cluster
# GitLab (mirror_trigger_builds=true), so this runs on push / mirror-sync on the
# privileged x86 runner (shell executor with docker, matching the generator CI).
# Images carry NO keys — KEYS material is supplied from the USB at first boot.

# Pull in the centralized OWASP pen-test stage (hidden .pentest-* jobs) from the
# generator repo so this service shares ONE source of truth for SCA + DAST. The
# pentest:sca / pentest:dast jobs below `extends:` those hidden jobs and run the
# full harness (Dependency-Check SCA + authenticated ZAP baseline + probes/nuclei).
include:
  - project: 'Snapdragon-Systems/snapdragon-generator'
    ref: main
    file: '/tests/pentest/ci/pentest-stage.gitlab-ci.yml'

stages: [test, security, dast, build, pentest]

test:
  stage: test
  tags: [snapdragon-x86, privileged]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
  script:
    # snapdragon-commons / snapdragon-parent are PRIVATE (GitLab Maven registry, not
    # Central). The throwaway build container has an empty ~/.m2, so Maven must use
    # the committed settings.xml (gitlab-maven repo, ${env.CI_JOB_TOKEN} auth). The
    # CI_JOB_TOKEN + the registry-coordinate env vars are passed INTO the container;
    # no secret is committed (the token is a short-lived GitLab-injected job cred).
    - |
      docker run --rm \
        -v "${CI_PROJECT_DIR}:/workspace:ro" -w /workspace \
        -e CI_JOB_TOKEN="$CI_JOB_TOKEN" \
        -e CI_API_V4_URL="$CI_API_V4_URL" \
        -e GITLAB_GROUP_ID="$GITLAB_GROUP_ID" \
        eclipse-temurin:21-jdk-noble ./mvnw -B -s settings.xml verify
  artifacts:
    when: always
    reports:
      junit: target/surefire-reports/TEST-*.xml
    paths:
      - target/surefire-reports/
    expire_in: 7 days

build:image:
  stage: build
  needs: [test]
  tags: [snapdragon-x86, privileged]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  variables:
    # BuildKit is required for the Dockerfile's `--mount=type=secret` private-dep
    # resolution (snapdragon-commons from the GitLab Maven registry).
    DOCKER_BUILDKIT: "1"
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # Immutable tag = release tag or git SHA; plus a moving branch tag the deploy/
    # kustomize can track for dev.
    - export TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    # CI_JOB_TOKEN is passed as a BuildKit SECRET (never persisted in a layer); the
    # GitLab registry coordinates go in as build-args so the committed settings.xml
    # can resolve the PRIVATE snapdragon-commons artifact during `./mvnw package`
    # inside the build stage. GITLAB_GROUP_ID must be set to the Snapdragon-Systems
    # group id (a CI/CD or group variable).
    - |
      docker build --pull \
        --secret id=ci_job_token,env=CI_JOB_TOKEN \
        --build-arg CI_API_V4_URL="$CI_API_V4_URL" \
        --build-arg GITLAB_GROUP_ID="$GITLAB_GROUP_ID" \
        -t "$CI_REGISTRY_IMAGE:$TAG" -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG" .
    - docker push "$CI_REGISTRY_IMAGE:$TAG"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"

dependency-check:
  stage: security
  needs: [test]
  tags: [snapdragon-x86, privileged]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  allow_failure: true
  script:
    - |
      docker run --rm \
        -v "$(pwd):/workspace" \
        -v "$(pwd)/.dep-check-data:/dep-check-data" \
        -w /workspace \
        --entrypoint "" \
        eclipse-temurin:21-jdk-noble \
        ./mvnw org.owasp:dependency-check-maven:check \
          -Dformat=HTML,JSON \
          -DfailBuildOnCVSS=9 \
          -DdataDirectory=/dep-check-data \
          -DautoUpdate=true \
          -B
  cache:
    key: dep-check-nvd
    paths: [.dep-check-data/]
  artifacts:
    when: always
    paths:
      - target/dependency-check-report.html
      - target/dependency-check-report.json
    expire_in: 30 days

zap-api-scan:
  stage: dast
  needs: [test]
  tags: [snapdragon-x86, privileged]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  allow_failure: true
  # Set DAST_TARGET_URL in GitLab CI/CD > Variables to activate the live scan.
  # Example: DAST_TARGET_URL=http://gateway.test-env:8080 pointing at a running
  # test environment. When unset the job exits 0 (advisory only, no gate).
  script:
    - |
      if [ -z "${DAST_TARGET_URL:-}" ]; then
        echo "[zap-api-scan] DAST_TARGET_URL not configured — no live target available."
        echo "Set DAST_TARGET_URL in GitLab CI/CD Variables to point to a running test env."
        echo "Example: DAST_TARGET_URL=http://gateway.test-env:8080"
        exit 0
      fi
      docker run --rm \
        -v "$(pwd):/zap/wrk:rw" \
        ghcr.io/zaproxy/zaproxy:stable \
        zap-api-scan.py \
          -t "${DAST_TARGET_URL}/v3/api-docs" \
          -f openapi \
          -r zap-report.html \
          -w zap-report.md \
          -x zap-report.xml \
          -l WARN \
          -I
  artifacts:
    when: always
    paths:
      - zap-report.html
      - zap-report.xml
      - zap-report.md
    expire_in: 30 days

# -----------------------------------------------------------------------------
# Centralized OWASP pen-test stage (single source of truth, included above).
# These thin jobs `extends:` the hidden .pentest-* jobs from the generator so the
# FULL harness (Dependency-Check SCA + ZAP baseline + custom probes + nuclei) runs
# without duplicating script blocks in every repo. Kept ADDITIVE alongside the
# legacy inline dependency-check / zap-api-scan jobs (migration left for a follow-up
# so the existing security/dast jobs stay untouched). allow_failure: advisory only.
# Rules mirror this repo's security-job posture: default branch + merge requests.
# -----------------------------------------------------------------------------
pentest:sca:
  extends: .pentest-sca
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

pentest:dast:
  extends: .pentest-dast-baseline
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
