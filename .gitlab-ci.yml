# HugMesh CI — build + push this service's container image to the in-cluster
# GitLab container registry. The GitHub repo is pull-mirrored into in-cluster
# GitLab (mirror_trigger_builds=true), so this runs on push / mirror-sync on the
# privileged x86 runner (shell executor with docker, matching the generator CI).
# Images carry NO keys — KEYS material is supplied from the USB at first boot.

# Pull in the centralized OWASP pen-test stage (hidden .pentest-* jobs) from the
# generator repo so this service shares ONE source of truth for SCA + DAST. The
# pentest:sca / pentest:dast jobs below `extends:` those hidden jobs and run the
# full harness (Dependency-Check SCA + authenticated ZAP baseline + probes/nuclei).
include:
  - project: 'hugmesh/hugmesh-generator'
    ref: main
    file: '/tests/pentest/ci/pentest-stage.gitlab-ci.yml'

stages: [test, security, dast, build, pentest]

test:
  stage: test
  tags: [hugmesh-x86, privileged]
  # Spring Boot 4 upgrade: the full-context tests now run against a REAL Postgres via
  # Testcontainers (net.hugmesh.commons.testsupport.PostgresTestSupport), so the
  # job needs a Docker daemon. Run Maven directly in a maven image with a docker:dind
  # SERVICE supplying the daemon (mirrors hugmesh-federation-api #43) instead of the
  # old `docker run` wrapper. hugmesh-commons / hugmesh-parent are PRIVATE (GitLab
  # Maven registry, not Central); the committed settings.xml resolves them with the
  # GitLab-injected CI_JOB_TOKEN (no secret committed). CI_API_V4_URL / GITLAB_GROUP_ID
  # are GitLab-provided / group variables read by settings.xml.
  image: maven:3.9-eclipse-temurin-25
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    # docker:dind over TLS; Testcontainers talks to the dind daemon at this DOCKER_HOST.
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_CERT_PATH: "/certs/client"
    DOCKER_TLS_VERIFY: "1"
    # Containers started by Testcontainers are reachable at the dind alias host.
    TESTCONTAINERS_HOST_OVERRIDE: "docker"
    # Ryuk (the resource reaper) needs extra privileges; disable it on the dind runner.
    TESTCONTAINERS_RYUK_DISABLED: "true"
    # This box's docker-java needs the pinned API version as a SYSPROP (env
    # DOCKER_API_VERSION does NOT work) — push it onto every JVM Maven forks via
    # MAVEN_OPTS so surefire's forked test JVMs inherit it.
    MAVEN_OPTS: "-Dapi.version=1.43"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
  script:
    - ./mvnw -B -s settings.xml verify
    # ANY TEST THAT REGENERATES A COMMITTED ARTEFACT PASSES BY REWRITING IT, and in a
    # throwaway CI workspace nobody ever sees the diff. OpenApiSpecDumpTest used to do exactly
    # that with src/main/resources/openapi/openapi.json: it wrote by default and asserted only
    # under an opt-in flag that nothing ever set, so the contract the ng-openapi-gen typed
    # clients and the docs pipeline consume drifted while the build stayed green. That test now
    # asserts by default; this line catches the NEXT such artefact without knowing what it is.
    # A clean tree after the build is the invariant; a dirty one means the build silently
    # disagreed with something that is checked in.
    - git diff --exit-code
      || { echo "BUILD REWROTE A COMMITTED FILE (see the diff above) — a test regenerated a checked-in artefact instead of asserting it. Regenerate locally and commit, or make that test assert."; exit 1; }
  artifacts:
    when: always
    reports:
      junit: target/surefire-reports/TEST-*.xml
    paths:
      - target/surefire-reports/
    expire_in: 7 days

# Shipped-config contract. Two classes, both pure JUnit — no Postgres, no
# Testcontainers, no Docker daemon — so they run HERE as their own gate, independent
# of the dind service `test` needs (they run inside `test` too):
#   ConfigDefaultsContractTest       — SHAPE: no pre-rebrand identifier under src/main,
#                                      and the duplicated copies of a default agree.
#   CasdoorRegistrationContractTest  — VALUE: every default on the POST /bff/login path
#                                      matches what the cluster's casdoor-init actually
#                                      registers (clientId app-user-bff, org hugmesh,
#                                      the internal Casdoor base, the PKCE redirect_uri).
#                                      Shape alone missed this: `user-bff` is not a
#                                      pre-rebrand identifier and had one single copy,
#                                      yet it is what made login 401 "Invalid client_id".
# A fresh cluster is the only place these defaults are ever exercised (the deployment
# overrides them), which is exactly why they went stale unnoticed until the first live
# kind run.
config-contract:
  stage: test
  tags: [hugmesh-x86, privileged]
  image: maven:3.9-eclipse-temurin-25
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
  script:
    - ./mvnw -B -s settings.xml -Dtest=ConfigDefaultsContractTest,CasdoorRegistrationContractTest test
  artifacts:
    when: always
    reports:
      junit: target/surefire-reports/TEST-*.xml
    expire_in: 7 days

build:image:
  stage: build
  needs: [test]
  tags: [hugmesh-x86, privileged]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  variables:
    # BuildKit is required for the Dockerfile's `--mount=type=secret` private-dep
    # resolution (hugmesh-commons from the GitLab Maven registry).
    DOCKER_BUILDKIT: "1"
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # Immutable tag = release tag or git SHA; plus a moving branch tag the deploy/
    # kustomize can track for dev.
    - export TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    # CI_JOB_TOKEN is passed as a BuildKit SECRET (never persisted in a layer); the
    # GitLab registry coordinates go in as build-args so the committed settings.xml
    # can resolve the PRIVATE hugmesh-commons artifact during `./mvnw package`
    # inside the build stage. GITLAB_GROUP_ID must be set to the hugmesh
    # group id (a CI/CD or group variable).
    - |
      docker build --pull \
        --secret id=ci_job_token,env=CI_JOB_TOKEN \
        --build-arg CI_API_V4_URL="$CI_API_V4_URL" \
        --build-arg GITLAB_GROUP_ID="$GITLAB_GROUP_ID" \
        -t "$CI_REGISTRY_IMAGE:$TAG" -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG" .
    - docker push "$CI_REGISTRY_IMAGE:$TAG"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"

dependency-check:
  stage: security
  needs: [test]
  tags: [hugmesh-x86, privileged]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  allow_failure: true
  script:
    - |
      docker run --rm \
        -v "$(pwd):/workspace" \
        -v "$(pwd)/.dep-check-data:/dep-check-data" \
        -w /workspace \
        --entrypoint "" \
        eclipse-temurin:25-jdk-noble \
        ./mvnw org.owasp:dependency-check-maven:check \
          -Dformat=HTML,JSON \
          -DfailBuildOnCVSS=9 \
          -DdataDirectory=/dep-check-data \
          -DautoUpdate=true \
          -B
  cache:
    key: dep-check-nvd
    paths: [.dep-check-data/]
  artifacts:
    when: always
    paths:
      - target/dependency-check-report.html
      - target/dependency-check-report.json
    expire_in: 30 days

zap-api-scan:
  stage: dast
  needs: [test]
  tags: [hugmesh-x86, privileged]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  allow_failure: true
  # Set DAST_TARGET_URL in GitLab CI/CD > Variables to activate the live scan.
  # Example: DAST_TARGET_URL=http://gateway.test-env:8080 pointing at a running
  # test environment. When unset the job exits 0 (advisory only, no gate).
  script:
    - |
      if [ -z "${DAST_TARGET_URL:-}" ]; then
        echo "[zap-api-scan] DAST_TARGET_URL not configured — no live target available."
        echo "Set DAST_TARGET_URL in GitLab CI/CD Variables to point to a running test env."
        echo "Example: DAST_TARGET_URL=http://gateway.test-env:8080"
        exit 0
      fi
      docker run --rm \
        -v "$(pwd):/zap/wrk:rw" \
        ghcr.io/zaproxy/zaproxy:stable \
        zap-api-scan.py \
          -t "${DAST_TARGET_URL}/v3/api-docs" \
          -f openapi \
          -r zap-report.html \
          -w zap-report.md \
          -x zap-report.xml \
          -l WARN \
          -I
  artifacts:
    when: always
    paths:
      - zap-report.html
      - zap-report.xml
      - zap-report.md
    expire_in: 30 days

# -----------------------------------------------------------------------------
# Centralized OWASP pen-test stage (single source of truth, included above).
# These thin jobs `extends:` the hidden .pentest-* jobs from the generator so the
# FULL harness (Dependency-Check SCA + ZAP baseline + custom probes + nuclei) runs
# without duplicating script blocks in every repo. Kept ADDITIVE alongside the
# legacy inline dependency-check / zap-api-scan jobs (migration left for a follow-up
# so the existing security/dast jobs stay untouched). allow_failure: advisory only.
# Rules mirror this repo's security-job posture: default branch + merge requests.
# -----------------------------------------------------------------------------
pentest:sca:
  extends: .pentest-sca
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

pentest:dast:
  extends: .pentest-dast-baseline
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# pentest:load — the OPT-IN k6 load / DoS-resilience run from the same shared
# harness (run-pentest.sh --load): realistic-mixed + stress k6 scenarios driven
# as the real seeded roles against the spun-up env-test-build (429 under stress
# = PASS, 5xx = FAIL). OFF by default: the hidden .pentest-load job gates on
# PENTEST_LOAD == "1" (a GitLab Schedule or a manual trigger), NEVER a plain MR,
# so this adds zero cost to normal pipelines. Completes the pen-test standard
# for this repo (SCA + DAST + nuclei were already wired above).
pentest:load:
  extends: .pentest-load
